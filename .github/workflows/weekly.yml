name: Daily Dashboard Update

# Runs every day 08:30 Asia/Bangkok (= 01:30 UTC) so performance history (TWR,
# risk stats, benchmark-relative) builds quickly. Also runnable on demand.
#
# NOTE: deliberately OFF the top of the hour. GitHub load-sheds scheduled jobs
# during peak (minute :00) load and silently drops them — an on-the-hour cron
# ("0 2 * * *") frequently never fires. A backstop tick an hour later recovers
# the day if the first is dropped; the pipeline is idempotent (commits only on a
# real diff), so a double-run just no-ops.
on:
  schedule:
    - cron: "30 1 * * *"   # 08:30 BKT — primary
    - cron: "30 2 * * *"   # 09:30 BKT — backstop if the first is dropped
  workflow_dispatch:

permissions:
  contents: write   # allow committing the refreshed docs/ + workbook back

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices, log snapshot, rebuild dashboard
        env:
          # Repo -> Settings -> Secrets and variables -> Actions -> New secret.
          # Use the "fund_api" subscription key (Product: sec-openapi-normal) from
          # https://secopendata.sec.or.th/. If unset, Thai MF NAVs carry forward
          # and everything else (equities, crypto, FX) still updates.
          SEC_OPENAPI_KEY: ${{ secrets.SEC_OPENAPI_KEY }}
        run: python pipeline/run_weekly.py --no-publish

      - name: Commit & push refreshed dashboard
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@github.com"
          git add docs "TH Investment - Private Banking Summary.xlsx" pipeline/sec_fund_map.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Weekly dashboard update — $(date -u +%Y-%m-%d)"
            git push
          fi
